version: 1
project:
  name: 依赖关系精简示例
  start_date: 2026-09-14
  default_scale: day
  theme: dark
  default_filter:
    labels: []
    mode: or
  allow_assignee_parallel_tasks: true
  assignees:
    - 未指定
    - 产品
    - 评审
    - 研发
    - 测试
    - 质量
calendar:
  years: []
  overrides: []
tasks:
  - uid: phase-plan
    order: 1
    name: 方案与评审
    description: 父任务：汇总方案阶段子任务的起止时间。
    assignee: 未指定
    status: 未开始
    earliest_start: null
    latest_finish: null
    duration_days: 0.5
    parent_uid: null
    collapse_children: false
    dependencies: []
    labels:
      - 阶段
    allow_rest_day_work: false
  - uid: brief
    order: 2
    name: 确认需求
    description: ""
    assignee: 产品
    status: 已完成
    earliest_start: null
    latest_finish: null
    duration_days: 1
    parent_uid: phase-plan
    collapse_children: false
    dependencies: []
    labels:
      - 起点
    allow_rest_day_work: false
  - uid: watch
    order: 3
    name: 持续跟踪至评审
    description: 短工期 until：0.5 天工作完成后，仍占用产品人员直到评审开始；截止时间按延伸后的结束计算。
    assignee: 产品
    status: 进行中
    earliest_start: null
    latest_finish: null
    duration_days: 0.5
    parent_uid: phase-plan
    collapse_children: false
    dependencies:
      - brief
    until: []
    labels:
      - 前置
    allow_rest_day_work: false
  - uid: review
    order: 4
    name: 方案评审
    description: 同时具有对 watch 的前置依赖与被 watch 持续至开始的 until 关系。
    assignee: 评审
    status: 验收中
    earliest_start:
      date: 2026-09-18
      period: am
    latest_finish: null
    duration_days: 0.5
    parent_uid: phase-plan
    collapse_children: false
    dependencies:
      - watch
    labels:
      - 前置
      - until
    allow_rest_day_work: false
  - uid: notes
    order: 5
    name: 整理评审资料
    description: watch 的后继：须等 until 延伸段结束后才能开始。
    assignee: 产品
    status: 未开始
    earliest_start: null
    latest_finish: null
    duration_days: 0.5
    parent_uid: phase-plan
    collapse_children: false
    dependencies:
      - watch
    until:
      - review
    labels:
      - 前置
      - until
    allow_rest_day_work: false
  - uid: phase-build
    order: 6
    name: 实现与交付
    description: 父任务：展示跨阶段依赖、并行、汇合及最终交付。
    assignee: 未指定
    status: 未开始
    earliest_start: null
    latest_finish: null
    duration_days: 0.5
    parent_uid: null
    collapse_children: false
    dependencies: []
    labels:
      - 阶段
    allow_rest_day_work: false
  - uid: api
    order: 7
    name: 开发接口
    description: ""
    assignee: 研发
    status: 进行中
    earliest_start: null
    latest_finish: null
    duration_days: 2
    parent_uid: phase-build
    collapse_children: false
    dependencies:
      - review
    labels:
      - 并行
      - 前置
    allow_rest_day_work: false
  - uid: ui
    order: 8
    name: 开发界面
    description: 与开发接口使用同一执行人并行，触发并行提示。
    assignee: 研发
    status: 进行中
    earliest_start: null
    latest_finish: null
    duration_days: 1.5
    parent_uid: phase-build
    collapse_children: false
    dependencies:
      - review
    labels:
      - 并行
      - 前置
    allow_rest_day_work: false
  - uid: verify
    order: 9
    name: 持续验证
    description: 长工期 until：自身预计工期超过抽检开始，任务块按预计工期结束。
    assignee: 测试
    status: 进行中
    earliest_start: null
    latest_finish:
      date: 2026-09-23
      period: am
    duration_days: 1
    parent_uid: phase-build
    collapse_children: false
    dependencies:
      - review
    until:
      - integrate
    labels:
      - until
      - 前置
    allow_rest_day_work: false
  - uid: checkpoint
    order: 10
    name: 阶段抽检
    description: ""
    assignee: 质量
    status: 验收中
    earliest_start:
      date: 2026-09-21
      period: am
    latest_finish: null
    duration_days: 0.5
    parent_uid: phase-build
    collapse_children: false
    dependencies:
      - review
    labels:
      - until
      - 前置
    allow_rest_day_work: false
  - uid: integrate
    order: 11
    name: 集成验收
    description: 多前置汇合；等待开发、持续验证及阶段抽检全部完成。
    assignee: 测试
    status: 未开始
    earliest_start: null
    latest_finish: null
    duration_days: 1
    parent_uid: phase-build
    collapse_children: false
    dependencies:
      - api
      - ui
      - checkpoint
      - verify
    labels:
      - 汇合
      - 前置
    allow_rest_day_work: false
  - uid: release
    order: 12
    name: 交付发布
    description: 跨父任务汇合：等待集成验收和评审资料。
    assignee: 产品
    status: 未开始
    earliest_start: null
    latest_finish: null
    duration_days: 0.5
    parent_uid: phase-build
    collapse_children: false
    dependencies:
      - integrate
      - notes
    labels:
      - 汇合
      - 前置
    allow_rest_day_work: false
